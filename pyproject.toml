[project]
name = "aigents"
version = "0.3.0"
description = "testing agents running as local Quadlet services against a self-hosted phi-4-mini model + PostgreSQL/pgvector store"
authors = [{ name = "Vieta", email = "vieta@uber.space" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.20,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["build", "worker", "deploy", "knowledge", "skills"]

# NOTE: each build/<role>-* directory is its own runnable crewAI project with
# its own [tool.crewai] definition (generated by `just`). This root package only
# installs the shared dependencies (crewai) used by worker/run_agent.py.