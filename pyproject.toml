[project]
name = "dhallcrew"
version = "0.2.0"
description = "testcrew rewritten with Dhall configs, run as 3 agents on 3 Raspberry Pis with MQTT coordination"
authors = [{ name = "Vieta", email = "vieta@uber.space" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.20,<2.0.0",
    "paho-mqtt>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["build", "worker", "deploy", "knowledge", "skills"]

# NOTE: each build/piN-* directory is its own runnable crewAI project with
# its own [tool.crewai] definition (generated by make). This root package only
# installs the shared dependencies (crewai + paho-mqtt) used by worker/worker.py.
